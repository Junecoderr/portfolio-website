# Cloud and identity rules for the conversion test subset (written for TB; see windows.yml).
title: CloudTrail logging stopped
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: cloudtrail.amazonaws.com
    eventName:
      - StopLogging
      - DeleteTrail
  condition: selection
level: high
tags:
  - attack.t1562.008
---
title: AWS console login without MFA
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: ConsoleLogin
    userIdentity.type: IAMUser
    additionalEventData.MFAUsed: 'No'
  condition: selection
level: medium
---
title: AWS access denied burst
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    errorCode:
      - AccessDenied
      - UnauthorizedOperation
  condition: selection | count() by sourceIPAddress > 30
timeframe: 10m
level: medium
---
title: Okta MFA factor reset
logsource:
  product: okta
  service: okta
detection:
  selection:
    eventtype:
      - user.mfa.factor.reset_all
      - user.mfa.factor.deactivate
  condition: selection
level: medium
---
title: M365 mailbox forwarding rule
logsource:
  product: m365
  service: exchange
detection:
  selection:
    Operation:
      - New-InboxRule
      - Set-InboxRule
    Parameters|contains: 'ForwardTo'
  condition: selection
level: medium
tags:
  - attack.t1114.003
