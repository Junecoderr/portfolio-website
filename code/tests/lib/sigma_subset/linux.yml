# Linux rules for the conversion test subset (written for TB; see windows.yml).
title: SSH brute force from one address
logsource:
  product: linux
  service: sshd
detection:
  selection:
    action: failed_login
  filter_internal:
    ip|cidr:
      - 10.0.0.0/8
      - 192.168.0.0/16
  condition: selection and not filter_internal | count() by ip > 10
timeframe: 5m
level: high
tags:
  - attack.t1110.001
---
title: Login with an invalid user name
logsource:
  product: linux
  service: auth
detection:
  selection:
    action: invalid_user
  condition: selection
level: low
---
title: Sudo by a user not in sudoers
logsource:
  product: linux
  service: sudo
detection:
  selection:
    message|contains: 'user NOT in sudoers'
  condition: selection
level: medium
tags:
  - attack.t1548.003
---
title: Root login over SSH
logsource:
  product: linux
  service: sshd
detection:
  selection:
    action: login
    user: root
  condition: selection
level: medium
---
title: Reverse shell keywords
logsource:
  product: linux
detection:
  keywords:
    - '/dev/tcp/'
    - 'nc -e /bin/sh'
    - 'bash -i >&'
  condition: keywords
level: high
tags:
  - attack.t1059.004
---
title: Auditd execution of a download tool into tmp
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: EXECVE
    a0:
      - wget
      - curl
  tmp:
    a2|startswith: '/tmp/'
  condition: selection and tmp
level: medium
---
title: Cron file edited by hand
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith:
      - '/crontab'
    CommandLine|contains: ' -e'
  condition: selection
level: low
tags:
  - attack.t1053.003
