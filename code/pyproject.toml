[project]
name = "tb-lang"
version = "3.1.0"
description = "TB - a small, friendly programming language"
requires-python = ">=3.10"
# tzdata: the IANA time-zone database (from the Python core team, pure data).
# Linux and macOS have one built in; Windows does not, and the datetime
# library needs it for zones like "Europe/Berlin".
dependencies = ["tzdata==2026.5"]

[dependency-groups]
dev = ["pytest==8.3.4", "pytest-timeout==2.3.1"]
build = ["pyinstaller==6.11.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# A hung test fails after 5 minutes with every thread's traceback, instead of
# stalling CI for hours.
timeout = 300
timeout_method = "thread"
faulthandler_timeout = 240
