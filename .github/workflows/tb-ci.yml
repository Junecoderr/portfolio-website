name: TB CI

# Tests for the TB language in code/ on Windows, macOS and Linux.

on:
  push:
    branches: [main]
    paths: ["code/**", ".github/workflows/tb-*.yml"]
  pull_request:
    paths: ["code/**", ".github/workflows/tb-*.yml"]

permissions:
  contents: read

concurrency:
  group: tb-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Use the Python from actions/setup-python, never a uv download.
      UV_PYTHON_PREFERENCE: only-system
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"

      # The gui library is tested against real Tk too. Windows and macOS
      # runners have a desktop; on Linux run under a virtual X display.
      - name: Install Xvfb (Linux)
        if: runner.os == 'Linux'
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      # tests/lib/test_evtx_windows.py compares the EVTX reader with wevtutil on
      # this runner's own Security, System, Application and PowerShell logs.
      # Sysmon (Microsoft Sysinternals, signature checked before it runs) adds a
      # Sysmon log to that comparison; if this step fails, the Sysmon case is
      # reported as skipped. Note: -accepteula accepts the Sysinternals licence,
      # so this step only runs once the repository variable TB_CI_INSTALL_SYSMON
      # is set to "true" by the owner.
      - name: Install Sysmon (Windows)
        if: runner.os == 'Windows' && vars.TB_CI_INSTALL_SYSMON == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "Sysmon.zip"
          $dir = Join-Path $env:RUNNER_TEMP "Sysmon"
          Invoke-WebRequest -Uri "https://download.sysinternals.com/files/Sysmon.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Join-Path $dir "Sysmon64.exe"
          $sig = Get-AuthenticodeSignature $exe
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") {
            throw "Sysmon64.exe is not validly signed by Microsoft: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
          & $exe -accepteula -i
          wevtutil gli Microsoft-Windows-Sysmon/Operational

      # Every test runs twice: on the bytecode VM (the default engine) and
      # on the tree-walking interpreter kept for one release (TB_ENGINE=tree).
      - name: Run tests, VM engine (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --locked pytest

      - name: Run tests, tree engine (Linux, virtual display)
        if: runner.os == 'Linux'
        env:
          TB_ENGINE: tree
        run: xvfb-run -a uv run --locked pytest

      # The VM translates hot code to Python (tbcore/jit.py); most test programs
      # are too short to get hot, so run them all translated once as well.
      - name: Run tests, VM with all code translated (Linux, virtual display)
        if: runner.os == 'Linux'
        env:
          TB_JIT: always
        run: xvfb-run -a uv run --locked pytest

      - name: Run tests, VM engine
        if: runner.os != 'Linux'
        run: uv run --locked pytest

      - name: Run tests, tree engine
        if: runner.os != 'Linux'
        env:
          TB_ENGINE: tree
        run: uv run --locked pytest

  # Benchmarks: fail when the VM gets more than 10% slower on any of
  # code/bench/*.tb. CI machines are noisy, so the check doesn't compare with
  # stored numbers: it checks out the commit this change starts from (a pull
  # request's base, or the previous commit on main) and runs both versions in
  # this job, taking turns, keeping each one's best CPU time, and measuring a
  # suspect benchmark again before failing (see code/bench/bench.py).
  bench:
    name: Benchmarks (no more than 10% slower)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      UV_PYTHON_PREFERENCE: only-system
      PYTHONUTF8: "1"
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"

      - name: Check out the version to compare with
        id: base
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null \
              && git cat-file -e "$BASE_SHA:code/tb.py" 2>/dev/null; then
            git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No earlier version of TB to compare with; skipping the benchmark check."
          fi

      - name: Compare the benchmarks (fails on more than 10% slower)
        if: steps.base.outputs.found == 'true'
        run: uv run --locked python bench/bench.py --against "$RUNNER_TEMP/base/code" --max-slowdown 10
