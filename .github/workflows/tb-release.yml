name: TB Release

# Push a tag like tb-v3.0.0 to build TB for Windows (installer + portable zip),
# macOS and Linux, plus the VS Code extension (tb-vscode-<version>.vsix) and the
# run-with-Python zip, and publish them, with checksums, as a GitHub Release. The website at
# code.tanisha.ceo links to the release whose tag matches tb.__version__.
# "Run workflow" (workflow_dispatch) only builds and tests the binaries.

on:
  push:
    tags: ["tb-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.2"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # PyInstaller cannot cross-compile, so every OS builds on its own runner.
          # Each builds the one-folder app dist/tb/ and packages it.
          - os: windows-latest      # tb-windows-x64-setup.exe + tb-windows-x64.zip
            name: windows-x64
            binary: dist/tb/tb.exe
          - os: macos-14            # Apple Silicon (arm64): tb-macos-arm64.zip
            name: macos-arm64
            binary: dist/tb/tb
          - os: ubuntu-22.04        # older glibc (2.35) so it runs on more Linux systems: tb-linux-x64.tar.gz
            name: linux-x64
            binary: dist/tb/tb
            xvfb: xvfb-run -a       # virtual display for the gui checks
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      UV_PYTHON_PREFERENCE: only-system
      PYTHONUTF8: "1"
      XVFB: ${{ matrix.xvfb }}
    defaults:
      run:
        shell: bash
        working-directory: code
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Check tag matches tb.__version__
        if: startsWith(github.ref, 'refs/tags/tb-v')
        run: |
          want="${GITHUB_REF_NAME#tb-v}"
          have="$(uv run --locked python -c 'import tb; print(tb.__version__)')"
          echo "tag: $want  tb.py: $have"
          test "$want" = "$have"

      # Windows and macOS runners have a desktop; Linux gets a virtual X
      # display so the gui library and a GUI app can really open a window.
      - name: Install Xvfb (Linux)
        if: runner.os == 'Linux'
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      # Every test runs on both engines: the bytecode VM (default) and the
      # tree-walking interpreter (TB_ENGINE=tree).
      - name: Run tests (VM engine)
        run: $XVFB uv run --locked pytest

      - name: Run tests (tree engine)
        env:
          TB_ENGINE: tree
        run: $XVFB uv run --locked pytest

      # The Windows installer is made with Inno Setup (preinstalled on
      # windows-latest; installed with Chocolatey if an image ever lacks it).
      - name: Make sure Inno Setup is available (Windows)
        if: runner.os == 'Windows'
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] && ! command -v iscc >/dev/null; then
            choco install innosetup -y --no-progress
          fi

      # build.py builds dist/tb/ (tb, tblaunch; Windows also tbw.exe and
      # tblaunchw.exe), smoke-tests it (--version, welcome.tb, tb check,
      # tb fmt --check, tb doc, a json/re/hash/ioc/logs/sqlite program, a 3.0
      # class/match/generator program on both engines, tb build + running the
      # built launcher, and a GUI app that closes itself), packages it, unpacks
      # the archive and tests that copy too (every example and app, tb test
      # spec / apps/log-triage / packages), and on Windows builds the installer.
      # TB_REQUIRE_GUI=1 turns a missing Tk/display into a failure.
      - name: Build
        env:
          TB_REQUIRE_GUI: "1"
        run: $XVFB uv run --locked --group build python packaging/build.py

      - name: Run examples, apps and test suites through the build
        run: $XVFB uv run --locked python packaging/run_examples.py "${{ matrix.binary }}" --root dist/tb --gui

      # Silent per-user install into a temp folder, run the installed tb.exe
      # (--version, every example/app, tbw.exe with a GUI app, tb build --gui
      # and the resulting tblaunchw-based app.exe), check the Start menu
      # shortcuts and the .tb icon, then a silent uninstall that must remove
      # the folder, the PATH entry, .tb and the Start menu folder.
      - name: Test the installer (Windows)
        if: runner.os == 'Windows'
        run: uv run --locked python packaging/windows/test_installer.py dist/tb-windows-x64-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            code/dist/tb-*.zip
            code/dist/tb-*.tar.gz
            code/dist/tb-*-setup.exe
          if-no-files-found: error
          retention-days: 7

  vscode:
    name: VS Code extension
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: code/editors/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: code/editors/vscode/package-lock.json

      # npm ci installs exactly package-lock.json (vscode-languageclient and
      # @vscode/vsce); `npm run package` runs vsce -> tb-vscode-<version>.vsix.
      - name: Build the .vsix
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          rm -f tb-vscode-*.vsix
          npm run package
          version="$(node -p "require('./package.json').version")"
          test -f "tb-vscode-${version}.vsix"
          unzip -l "tb-vscode-${version}.vsix"
          mkdir -p ../../dist
          mv "tb-vscode-${version}.vsix" ../../dist/

      - uses: actions/upload-artifact@v4
        with:
          name: vscode
          path: code/dist/tb-vscode-*.vsix
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: [build, vscode]
    if: startsWith(github.ref, 'refs/tags/tb-v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      UV_PYTHON_PREFERENCE: only-system
    defaults:
      run:
        shell: bash
        working-directory: code
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          path: code/dist
          merge-multiple: true

      - name: Build tb-python.zip
        run: uv run --locked python packaging/make_fallback_zip.py

      - name: Write SHA256SUMS.txt
        run: |
          uv run --locked python packaging/build.py --checksums-only
          cd dist && sha256sum --check SHA256SUMS.txt

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=(
            dist/tb-windows-x64-setup.exe
            dist/tb-windows-x64.zip
            dist/tb-macos-arm64.zip
            dist/tb-linux-x64.tar.gz
            dist/tb-python.zip
            dist/tb-vscode-*.vsix
            dist/SHA256SUMS.txt
          )
          ls -l "${assets[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            # --latest=false keeps TB releases from being shown as the site's "latest release".
            gh release create "$TAG" "${assets[@]}" --title "TB ${TAG#tb-v}" --notes "Downloads for the TB programming language. See https://code.tanisha.ceo/download for install steps." --latest=false
          fi
