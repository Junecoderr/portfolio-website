name: TB Release

# Push a tag like tb-v2.0.0 to build TB for Windows (installer + portable zip),
# macOS and Linux and publish them, with checksums, as a GitHub Release. The website at
# code.tanisha.ceo links to the release whose tag matches tb.__version__.
# "Run workflow" (workflow_dispatch) only builds and tests the binaries.

on:
  push:
    tags: ["tb-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.2"
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # PyInstaller cannot cross-compile, so every OS builds on its own runner.
          # Each builds the one-folder app dist/tb/ and packages it.
          - os: windows-latest      # tb-windows-x64-setup.exe + tb-windows-x64.zip
            name: windows-x64
            binary: dist/tb/tb.exe
          - os: macos-14            # Apple Silicon (arm64): tb-macos-arm64.zip
            name: macos-arm64
            binary: dist/tb/tb
          - os: ubuntu-22.04        # older glibc (2.35) so it runs on more Linux systems: tb-linux-x64.tar.gz
            name: linux-x64
            binary: dist/tb/tb
            xvfb: xvfb-run -a       # virtual display for the gui checks
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      UV_PYTHON_PREFERENCE: only-system
      PYTHONUTF8: "1"
      XVFB: ${{ matrix.xvfb }}
    defaults:
      run:
        shell: bash
        working-directory: code
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Check tag matches tb.__version__
        if: startsWith(github.ref, 'refs/tags/tb-v')
        run: |
          want="${GITHUB_REF_NAME#tb-v}"
          have="$(uv run --locked python -c 'import tb; print(tb.__version__)')"
          echo "tag: $want  tb.py: $have"
          test "$want" = "$have"

      # Windows and macOS runners have a desktop; Linux gets a virtual X
      # display so the gui library and a GUI app can really open a window.
      - name: Install Xvfb (Linux)
        if: runner.os == 'Linux'
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Run tests
        run: $XVFB uv run --locked pytest

      # The Windows installer is made with Inno Setup (preinstalled on
      # windows-latest; installed with Chocolatey if an image ever lacks it).
      - name: Make sure Inno Setup is available (Windows)
        if: runner.os == 'Windows'
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] && ! command -v iscc >/dev/null; then
            choco install innosetup -y --no-progress
          fi

      # build.py builds dist/tb/, smoke-tests it (--version, for_tanisha.tb,
      # `tb doc`, `tb doc gui`, a json/re/hash/ioc/logs program and a GUI app
      # that closes itself), packages it, unpacks the archive and tests that
      # copy too, and on Windows builds the installer.
      # TB_REQUIRE_GUI=1 turns a missing Tk/display into a failure.
      - name: Build
        env:
          TB_REQUIRE_GUI: "1"
        run: $XVFB uv run --locked --group build python packaging/build.py

      - name: Run examples, non-GUI apps and app tests through the build
        run: uv run --locked python packaging/run_examples.py "${{ matrix.binary }}" --root dist/tb

      # Silent per-user install into a temp folder, run the installed tb.exe
      # (--version, every example/app, tbw.exe with a GUI app), then a silent
      # uninstall that must remove the folder, the PATH entry and .tb.
      - name: Test the installer (Windows)
        if: runner.os == 'Windows'
        run: uv run --locked python packaging/windows/test_installer.py dist/tb-windows-x64-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            code/dist/tb-*.zip
            code/dist/tb-*.tar.gz
            code/dist/tb-*-setup.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/tb-v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      UV_PYTHON_PREFERENCE: only-system
    defaults:
      run:
        shell: bash
        working-directory: code
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          path: code/dist
          merge-multiple: true

      - name: Build tb-python.zip
        run: uv run --locked python packaging/make_fallback_zip.py

      - name: Write SHA256SUMS.txt
        run: |
          uv run --locked python packaging/build.py --checksums-only
          cd dist && sha256sum --check SHA256SUMS.txt

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=(
            dist/tb-windows-x64-setup.exe
            dist/tb-windows-x64.zip
            dist/tb-macos-arm64.zip
            dist/tb-linux-x64.tar.gz
            dist/tb-python.zip
            dist/SHA256SUMS.txt
          )
          ls -l "${assets[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            # --latest=false keeps TB releases from being shown as the site's "latest release".
            gh release create "$TAG" "${assets[@]}" --title "TB ${TAG#tb-v}" --notes "Downloads for the TB programming language. See https://code.tanisha.ceo/download for install steps." --latest=false
          fi
